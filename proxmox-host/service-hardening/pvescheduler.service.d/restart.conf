# Stock PVE unit ships no Restart= directive, so a crash leaves the daemon dead
# until a human notices. Added 2026-07-27 after pvestatd died of a perl GPF on
# 2026-07-24 and sat failed for 3 days. Deliberately NOT applied to pve-ha-lrm /
# pve-ha-crm, where HA fencing semantics make auto-restart unsafe.
[Service]
Restart=on-failure
RestartSec=10
