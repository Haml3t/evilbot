# Model catalog — defines VRAM requirements and which nodes can serve each model.
# The proxy reads this at startup; edit and restart the proxy to add/remove models.
#
# vram_mb: minimum VRAM required in MB
# nodes: ordered list of preferred nodes (first = primary, second = fallback)
# type: "imagegen" or "llm"
# backend_model: name passed to the backend service (Ollama model tag, ComfyUI checkpoint filename)

imagegen:
  sd-1.5:
    vram_mb: 4000
    nodes: [evilbot, gpu-desktop]
    backend_model: "v1-5-pruned-emaonly-fp16.safetensors"

  sdxl-base:
    vram_mb: 7000
    nodes: [evilbot, gpu-desktop]
    backend_model: "sd_xl_base_1.0.safetensors"

  sdxl-refiner:
    vram_mb: 7000
    nodes: [evilbot, gpu-desktop]
    backend_model: "sd_xl_refiner_1.0.safetensors"

  flux-schnell:
    vram_mb: 20000
    nodes: [gpu-desktop]
    backend_model: "flux1-schnell-fp8.safetensors"

  flux-dev:
    vram_mb: 22000
    nodes: [gpu-desktop]
    backend_model: "flux1-dev-fp8.safetensors"

llm:
  llama-3-8b:
    vram_mb: 5500
    nodes: [evilbot, gpu-desktop]
    backend_model: "llama3:8b-instruct-q4_0"

  mistral-7b:
    vram_mb: 5000
    nodes: [evilbot, gpu-desktop]
    backend_model: "mistral:7b-instruct-q4_0"

  qwen-32b:
    vram_mb: 19000
    nodes: [gpu-desktop]
    backend_model: "qwen2.5:32b-instruct-q4_K_M"

  qwen-32b-think:
    vram_mb: 19000
    nodes: [gpu-desktop]
    backend_model: "qwen2.5:32b-instruct-q4_K_M"
    think: true

  # Donnertune — self-hosted Qwen3-14B fine-tune (see Haml3t/donnertune-self-hosting).
  # Served by vLLM, NOT Ollama: the prompt contract requires raw /v1/completions,
  # because the baked chat template needs a quality key the chat API won't pass
  # through. fp8 weights ~15.2 GiB; needs ~22 GB free (24 GB card at util ~0.92).
  # Only gpu-desktop (3090, 24 GB) is eligible — evilbot's 8 GB cannot fit it, so
  # there is no fallback, same as flux-dev.
  #
  # Ampere caveat: fp8 runs via Marlin weight-only kernels on the 3090 — correct
  # but slower than native Ada/Hopper fp8.
  donnertune-sft-14b-ep2-fp8:
    vram_mb: 22000
    nodes: [gpu-desktop]
    backend: vllm
    backend_model: "donnertune-sft-14b-ep2-fp8"

  # bf16 release (~27.5 GiB) needs >= 40 GB — no fleet node qualifies. If a
  # 48 GB / 80 GB node is ever added, uncomment with the right `nodes` entry.

nodes:
  evilbot:
    image_api_url: "http://192.168.0.145:5005"   # image-api wrapper — what the Telegram bot talks to
    imagegen_url: "http://192.168.0.145:8288"     # ComfyUI native API — evilbot maps container :8188 → host :8288
    llm_url: "http://192.168.0.145:11434"
    vram_reporter_url: "http://192.168.0.145:9835"
    vram_mb: 8192

  gpu-desktop:
    image_api_url: "http://192.168.0.12:5005"
    imagegen_url: "http://192.168.0.12:8188"
    llm_url: "http://192.168.0.12:11434"
    vllm_url: "http://192.168.0.12:8000"          # vLLM (donnertune) — OpenAI-compatible, raw completions
    vram_reporter_url: "http://192.168.0.12:9835"
    gpu_ctl_url: "http://192.168.0.12:9840"       # gpu-ctl lifecycle agent (vLLM start/stop + lockout)
    vram_mb: 24576
